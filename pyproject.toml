[project]
name = "ChatCat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-community>=0.2.12",
    "langchain-text-splitters>=0.2.2",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.1.22",
    "sentence-transformers>=3.0.0",
    "langgraph>=0.2.31",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pypdf>=4.3.1",
    "docx2txt>=0.8",
    "unstructured",
    "openpyxl",
    "tabulate",
    "msoffcrypto-tool",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary]>=3.1.0",
    "redis>=5.2.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langsmith>=0.1.0",
]

# uv 0.11+ 裸 `uv sync` 默认不安装 extras，只安装 dependency-groups。
# 为保证 `uv sync`（CLAUDE.md 标准命令）即装好 dev 工具链（pytest 等），
# 这里用 dependency-groups 声明与上方 optional-dependencies.dev 相同的包。
[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langsmith>=0.1.0",  # eval/eval_langsmith.py
]

[tool.ruff]
line-length = 120
target-version = "py312"
# 追加默认排除项（.venv/.git 等已由 ruff 默认排除）
extend-exclude = [
    "frontend",
    "data",
]
fix = true

[tool.ruff.lint]
select = [
    "E", "W", # flake8 error/warning
    "I",      # import排序
    "F",      # 语法简化
]
# 需要更强规则时可追加："UP" (pyupgrade), "B" (bugbear), "SIM" (simplify)

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ruff format 与 black 保持一致的风格
[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
    frontend
  | data
)/
'''

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
